<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Radial Glow -->
    <radialGradient id="davionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06090F" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Neon Shading for D Spine -->
    <linearGradient id="davionSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Focal Accent Glow -->
    <radialGradient id="focalPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="240" height="240" rx="36" fill="#06090F" />
  <rect width="238" height="238" x="1" y="1" rx="35" fill="none" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="120" cy="120" r="85" fill="url(#davionGlow)" />

  <!-- Outer Geometric "D" Monogram -->
  <!-- Vertical Spine -->
  <line x1="68" y1="52" x2="68" y2="188" stroke="url(#davionSpine)" stroke-width="12" stroke-linecap="round" />

  <!-- Smooth Cranial "D" Outer Arc -->
  <path d="M 68 52 
           C 142 52, 184 82, 184 120 
           C 184 158, 142 188, 68 188" 
        fill="none" 
        stroke="#F8FAFC" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Reticle & Crosshair (Medical Focal Target) -->
  <g transform="translate(116, 120)">
    <!-- Soft Target Ring Glow -->
    <circle cx="0" cy="0" r="26" fill="url(#focalPulse)" />
    
    <!-- Outer Thin Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
    
    <!-- Inner Solid Precision Ring -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    
    <!-- Center Detection Target Dot -->
    <circle cx="0" cy="0" r="4" fill="#38BDF8" />

    <!-- Crosshair Ticks -->
    <!-- North -->
    <line x1="0" y1="-32" x2="0" y2="-18" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- South -->
    <line x1="0" y1="18" x2="0" y2="32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- West -->
    <line x1="-32" y1="0" x2="-18" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <!-- East -->
    <line x1="18" y1="0" x2="32" y2="0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Precision Medical Corner Markers -->
  <path d="M 30 40 L 30 30 L 40 30" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M 210 40 L 210 30 L 200 30" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M 30 200 L 30 210 L 40 210" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <path d="M 210 200 L 210 210 L 200 210" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
</svg>
